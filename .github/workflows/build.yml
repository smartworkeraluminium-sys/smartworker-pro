name: Build Smart Worker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10.11'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt-get install -y \
          build-essential git \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          zlib1g-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev \
          openssl libgdbm-dev liblzma-dev libreadline-dev \
          zip unzip autoconf libtool pkg-config \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
        pip install --upgrade pip
        pip install buildozer cython==0.29.33 virtualenv

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartWorker-APK
        path: bin/*.apk


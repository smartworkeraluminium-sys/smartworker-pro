<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Worker Pro • Owner Admin Console</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Cloud Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #0284c7;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Top Bar */
    .top-bar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .top-bar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .top-bar .title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: 0.5px;
    }
    .top-bar .sub {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 1px;
    }
    .btn-nav {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: #334155;
      color: #fff;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* Status Grid */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .status-card.red-alert {
      border-left: 4px solid var(--danger);
    }
    .status-card.green-alert {
      border-left: 4px solid var(--success);
    }
    .status-card.blue-alert {
      border-left: 4px solid var(--blue);
    }
    .status-card.yellow-alert {
      border-left: 4px solid var(--accent);
    }
    .status-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-val {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      margin-top: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot-blue { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
    .dot-yellow { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    /* Admin Cards */
    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }
    .card-title {
      font-size: 0.98rem;
      font-weight: 800;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .card-title i {
      color: var(--accent);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: #94a3b8;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .form-group label {
      font-size: 0.76rem;
      font-weight: 700;
      color: #cbd5e1;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    input, select {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      color: #fff;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 0.88rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-wa { background: #22c55e; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }

    /* Key Display Box */
    .key-box {
      background: #064e3b;
      border: 1px solid #10b981;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: none;
    }
    .key-display {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-align: center;
      color: #6ee7b7;
      background: #022c22;
      padding: 10px;
      border-radius: 8px;
      margin: 8px 0;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Subscriber Card */
    .sub-card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
    }
    .sub-card.pending {
      border-left: 4px solid var(--danger);
    }
    .sub-card.active {
      border-left: 4px solid var(--success);
    }
    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .sub-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }
    .sub-shop {
      font-size: 0.74rem;
      color: var(--accent);
      margin-top: 1px;
    }
    .badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge-red { background: #450a0a; color: #f87171; border: 1px solid #dc2626; }
    .badge-green { background: #022c22; color: #4ade80; border: 1px solid #16a34a; }
    .badge-blue { background: #172554; color: #60a5fa; border: 1px solid #2563eb; }

    .sub-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.75rem;
      color: #cbd5e1;
      margin: 8px 0;
      background: #131b2e;
      padding: 8px 10px;
      border-radius: 8px;
    }
    .sub-code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #38bdf8;
    }
    .btn-row-sm {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-sm {
      padding: 8px;
      font-size: 0.76rem;
      border-radius: 7px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .search-box {
      margin-bottom: 12px;
      position: relative;
    }
    .search-box input {
      padding-left: 36px;
    }
    .search-box i {
      position: absolute;
      left: 12px;
      top: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>

    <a href="index.html" class="btn-nav">

  <div class="container">

  <!-- SHA-256 Engine & Admin Logic -->
  <script>
    function sha256(ascii) {
      function rightRotate(value, amount) { return (value>>>amount) | (value<<(32 - amount)); }
      var mathPow = Math.pow; var maxWord = mathPow(2, 32); var lengthProperty = 'length';
      var i, j; var result = ''; var words = []; var asciiBitLength = ascii[lengthProperty]*8;
      var hash = sha256.h = sha256.h || []; var k = sha256.k = sha256.k || []; var primeCounter = k[lengthProperty];
      var isComposite = {};
      for (var candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
          hash[primeCounter] = (mathPow(candidate, .5)*maxWord)|0;
          k[primeCounter++] = (mathPow(candidate, 1/3)*maxWord)|0;
        }
      }
      ascii += '\x80';
      while (ascii[lengthProperty]%64 - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j>>8) return;
        words[i>>2] |= j << ((3 - i)%4)*8;
      }
      words[words[lengthProperty]] = ((asciiBitLength/maxWord)|0);
      words[words[lengthProperty]] = (asciiBitLength);
      for (j = 0; j < words[lengthProperty];) {
        var w = words.slice(j, j += 16); var oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          var i2 = i + j;
          var w15 = w[i - 15], w2 = w[i - 2];
          var a = hash[0], e = hash[4];
          var temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15>>>3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2>>>10))
              )|0
            );
          var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2)|0].concat(hash);
          hash[4] = (hash[4] + temp1)|0;
        }
        for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i])|0; }
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          var b = (hash[i]>>(j*8))&255;
          result += ((b < 16) ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    const SALTS = {
      "KARIGAR_1M": "SAHEB_1M_PRO",
      "KARIGAR_3M": "SAHEB_1M_PRO",
      "KARIGAR_6M": "SAHEB_1Y_PRO",
      "KARIGAR_1Y": "SAHEB_1Y_PRO",
      "TEAM_1M": "SAHEB_TEAM_1M_PRO",
      "TEAM_1Y": "SAHEB_TEAM_1Y_PRO",
      "CORP_1M": "SAHEB_CORP_1M_PRO",
      "CORP_1Y": "SAHEB_CORP_1Y_PRO"
    };
    const SPECIAL_PROMO_CODE = "SMARTWORKER_ADMIN_100";

    const PLAN_RATES = {
      "KARIGAR_1M": 99,
      "KARIGAR_3M": 280,
      "KARIGAR_6M": 550,
      "KARIGAR_1Y": 799,
      "TEAM_1M": 499,
      "TEAM_1Y": 3999,
      "CORP_1M": 1499,
      "CORP_1Y": 14999,
      "LIFETIME": 25000
    };

    const PLAN_NAMES = {
      "KARIGAR_1M": "Karigar Plan (1 Month)",
      "KARIGAR_3M": "Karigar Plan (3 Months)",
      "KARIGAR_6M": "Karigar Plan (6 Months)",
      "KARIGAR_1Y": "Karigar Plan (1 Year)",
      "TEAM_1M": "Workshop Team (10 Users - 1 Month)",
      "TEAM_1Y": "Workshop Team (10 Users - 1 Year)",
      "CORP_1M": "Corporate Enterprise (50 Users - 1 Month)",
      "CORP_1Y": "Corporate Enterprise (50 Users - 1 Year)",
      "LIFETIME": "Lifetime VIP Pro"
    };

    let activeInvoiceObj = null;
    let currentTabFilter = "all";

    function autoFillPlanCost() {
      const plan = document.getElementById('in_plan').value;
      const amt = PLAN_RATES[plan] || 99;
      document.getElementById('in_bill').value = amt;
      document.getElementById('in_paid').value = amt;
      calculateBalanceDue();
    }

    function calculateBalanceDue() {
      const bill = parseFloat(document.getElementById('in_bill').value) || 0;
      const paid = parseFloat(document.getElementById('in_paid').value) || 0;
      const due = Math.max(0, bill - paid);
      document.getElementById('in_due').value = due;
    }

    function computeKey(devId, plan) {
      devId = String(devId || '').trim().toUpperCase();
      if (!devId) return null;
      if (plan === "LIFETIME") return SPECIAL_PROMO_CODE;
      const salt = SALTS[plan] || "SAHEB_1M_PRO";
      return sha256(devId + salt).substring(0, 8).toUpperCase();
    }

    function computeExpiry(plan) {
      const d = new Date();
      if (plan.includes('1M')) d.setDate(d.getDate() + 30);
      else if (plan.includes('3M')) d.setDate(d.getDate() + 90);
      else if (plan.includes('6M')) d.setDate(d.getDate() + 180);
      else if (plan.includes('1Y')) d.setDate(d.getDate() + 365);
      else if (plan === 'LIFETIME') return "Lifetime Active";
      return d.toLocaleDateString('en-GB');
    }

    function generateAndSaveKey() {
      const name = document.getElementById('in_name').value.trim();
      const shop = document.getElementById('in_shop').value.trim();
      const phone = document.getElementById('in_phone').value.trim();
      const devId = document.getElementById('in_dev_id').value.trim().toUpperCase();
      const plan = document.getElementById('in_plan').value;
      const bill = parseFloat(document.getElementById('in_bill').value) || 0;
      const paid = parseFloat(document.getElementById('in_paid').value) || 0;
      const due = parseFloat(document.getElementById('in_due').value) || 0;
      const payMode = document.getElementById('in_pay_mode').value;
      const utr = document.getElementById('in_utr').value.trim();

      if (!name || !phone || !devId) {
        alert("Please provide Customer Name, Phone, and 8-character Device ID!");
        return;
      }
      if (devId.length !== 8) {
        alert("Device ID must be exactly 8 characters!");
        return;
      }

      const key = computeKey(devId, plan);
      const expDate = computeExpiry(plan);
      const today = new Date().toLocaleDateString('en-GB');

      const subscriberRecord = {
        id: "SUB_" + Date.now(),
        device_id: devId,
        name: name,
        shop: shop || "Aluminium Workshop",
        phone: phone,
        plan: plan,
        plan_name: PLAN_NAMES[plan] || plan,
        bill_amount: bill,
        paid_amount: paid,
        due_amount: due,
        pay_mode: payMode,
        utr: utr || "Paid",
        activation_key: key,
        status: "ACTIVE",
        start_date: today,
        expiry_date: expDate,
        timestamp: Date.now()
      };

      let list = JSON.parse(localStorage.getItem('sw_active_subscribers') || '[]');
      const existIdx = list.findIndex(s => s.device_id === devId);
      if (existIdx !== -1) {
        list[existIdx] = subscriberRecord;
      } else {
        list.unshift(subscriberRecord);
      }
      localStorage.setItem('sw_active_subscribers', JSON.stringify(list));

      // Also sync to Firebase if available
      try {
        if (window.fbDb) {
          fbDb.collection('subscribers').doc(devId).set(subscriberRecord).catch(() => {});
        }
      } catch(e){}

      document.getElementById('displayGeneratedKey').textContent = key;
      document.getElementById('keyExpiryInfo').textContent = "Valid Till: " + expDate;
      document.getElementById('keyBoxResult').style.display = "block";

      activeInvoiceObj = subscriberRecord;
      renderSubscribers();
      alert("Activation Key Generated Successfully!");
    }

    function copyGeneratedKeyToClipboard() {
      const key = document.getElementById('displayGeneratedKey').textContent;
      if (!key || key.includes('-')) return;
      navigator.clipboard.writeText(key).then(() => {
        alert("Activation Key Copied: " + key);

    function setFilterTab(tab) {
      currentTabFilter = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderSubscribers();
    }

    function renderSubscribers() {
      const list = JSON.parse(localStorage.getItem('sw_active_subscribers') || '[]');
      const requests = JSON.parse(localStorage.getItem('sw_recharge_requests') || '[]');
      
      // Combine requests and subscribers
      const combined = [...requests.filter(r => r.status === 'Pending').map(r => ({
        device_id: r.device_id,
        name: r.name,
        shop: r.shop || "New Customer",
        phone: r.phone,
        plan: r.plan,
        plan_name: PLAN_NAMES[r.plan] || r.plan,
        bill_amount: PLAN_RATES[r.plan] || 99,
        paid_amount: PLAN_RATES[r.plan] || 99,
        due_amount: 0,
        activation_key: r.generated_key || "PENDING",
        status: "PENDING_ACTIVATION",
        start_date: r.date || "Today",
        expiry_date: "Pending Activation",
        utr: r.utr
      })), ...list];

      // Update Metric Badges
      const pendingCount = combined.filter(s => s.status === 'PENDING_ACTIVATION' || s.status === 'Pending').length;
      const activeCount = combined.filter(s => s.status === 'ACTIVE').length;
      const totalRev = combined.reduce((sum, s) => sum + (parseFloat(s.paid_amount) || 0), 0);

      document.getElementById('statPendingCount').textContent = pendingCount;
      document.getElementById('statActiveCount').textContent = activeCount;
      document.getElementById('statOnlineCount').textContent = combined.length;
      document.getElementById('statTotalRevenue').textContent = "₹" + totalRev.toLocaleString('en-IN');
      document.getElementById('queueTotalBadge').textContent = `${combined.length} Total`;

      const container = document.getElementById('subscribersListContainer');
      const query = (document.getElementById('subscriberSearchInput')?.value || '').trim().toLowerCase();

      let filtered = combined;
      if (currentTabFilter === 'pending') {
        filtered = combined.filter(s => s.status === 'PENDING_ACTIVATION' || s.status === 'Pending');
      } else if (currentTabFilter === 'active') {
        filtered = combined.filter(s => s.status === 'ACTIVE');
      }

      if (query) {
        filtered = filtered.filter(s => 
          (s.name || '').toLowerCase().includes(query) ||
          (s.phone || '').includes(query) ||
          (s.device_id || '').toLowerCase().includes(query)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:36px 10px; color:#64748b; font-size:0.85rem;">
            <i class="fa-solid fa-inbox" style="font-size:2rem; margin-bottom:8px; display:block; color:#334155;"></i>
            No subscribers found matching the criteria.
          </div>`;
        return;
      }

      let html = "";
      filtered.forEach((sub, i) => {
        const isPending = sub.status === 'PENDING_ACTIVATION' || sub.status === 'Pending';
        const cardClass = isPending ? 'pending' : 'active';
        const badgeMarkup = isPending ?
          `<span class="badge badge-red"><span class="status-dot dot-red"></span> NEW SUBSCRIBER</span>` :
          `<span class="badge badge-green"><span class="status-dot dot-green"></span> ACTIVE PRO</span>`;

        html += `
          <div class="sub-card ${cardClass}">
            <div class="sub-header">
              <div>
                <div class="sub-name">${sub.name}</div>
                <div class="sub-shop"><i class="fa-solid fa-store"></i> ${sub.shop || "Workshop"}</div>
              </div>
              ${badgeMarkup}
            </div>

            <div class="sub-meta-grid">
              <div><b>Mobile:</b> ${sub.phone}</div>
              <div><b>Device ID:</b> <span class="sub-code">${sub.device_id}</span></div>
              <div><b>Plan:</b> ${sub.plan_name || sub.plan}</div>
              <div><b>Expiry:</b> ${sub.expiry_date}</div>
              <div><b>Bill / Paid:</b> ₹${sub.bill_amount} / ₹${sub.paid_amount}</div>
              <div><b>Key:</b> <span class="sub-code" style="color:#4ade80;">${sub.activation_key || "NOT ISSUED"}</span></div>
            </div>

            <div class="btn-row-sm">
              <button type="button" class="btn-sm btn-wa" onclick='activateAndSendWhatsApp("${sub.device_id}", "${sub.name}", "${sub.phone}", "${sub.plan}")'>
                <i class="fa-brands fa-whatsapp"></i> Generate & Send Key
              </button>
              <button type="button" class="btn-sm" style="background:#1e293b; border:1px solid #334155; color:#38bdf8;" onclick='quickFillForm("${sub.device_id}", "${sub.name}", "${sub.phone}", "${sub.plan}")'>
                <i class="fa-solid fa-pen-to-square"></i> Edit Memo
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function activateAndSendWhatsApp(devId, name, phone, plan) {
      const key = computeKey(devId, plan);
      const expDate = computeExpiry(plan);
      const today = new Date().toLocaleDateString('en-GB');

      const record = {
        id: "SUB_" + Date.now(),
        device_id: devId,
        name: name,
        shop: "Workshop",
        phone: phone,
        plan: plan,
        plan_name: PLAN_NAMES[plan] || plan,
        bill_amount: PLAN_RATES[plan] || 99,
        paid_amount: PLAN_RATES[plan] || 99,
        due_amount: 0,
        activation_key: key,
        status: "ACTIVE",
        start_date: today,
        expiry_date: expDate,
        timestamp: Date.now()
      };

      let list = JSON.parse(localStorage.getItem('sw_active_subscribers') || '[]');
      const existIdx = list.findIndex(s => s.device_id === devId);
      if (existIdx !== -1) list[existIdx] = record;
      else list.unshift(record);
      localStorage.setItem('sw_active_subscribers', JSON.stringify(list));

      // Update pending requests in localStorage
      let reqs = JSON.parse(localStorage.getItem('sw_recharge_requests') || '[]');
      reqs = reqs.map(r => r.device_id === devId ? { ...r, status: "Approved", generated_key: key } : r);
      localStorage.setItem('sw_recharge_requests', JSON.stringify(reqs));

      // Sync approval and subscriber record to Firebase Firestore
      try {
        if (window.fbDb) {
          fbDb.collection('subscribers').doc(devId).set(record, { merge: true }).catch(() => {});
          fbDb.collection('recharge_requests').doc(devId).set({
            status: "Approved",
            activation_key: key,
            approved_at: new Date().toISOString()
          }, { merge: true }).catch(() => {});
        }
      } catch(e){}

      // Sync to Realtime Database
      try {
        if (window.fbRtdb) {
          fbRtdb.ref('subscribers/' + devId).set(record);
          fbRtdb.ref('recharge_requests/' + devId).update({
            status: "Approved",
            activation_key: key
          });
        }
      } catch(e){}

      renderSubscribers();
      sendInvoiceWhatsAppDirect(record);
    }

    function initFirebaseLiveListener() {
      try {
        const config = {
          apiKey: "AIzaSyBYBRTvmuf3mHuP1kveMv98idLAhJys2-M",
          authDomain: "nisha-creations.firebaseapp.com",
          databaseURL: "https://nisha-creations-default-rtdb.firebaseio.com",

          messagingSenderId: "726716735582",

        };
        if (window.firebase && !firebase.apps.length) {
          window.fbApp = firebase.initializeApp(config);
        }
        const db = firebase.firestore();
        window.fbDb = db;
        const rtdb = (firebase.database && typeof firebase.database === 'function') ? firebase.database() : null;
        window.fbRtdb = rtdb;

        // 1. Listen to Realtime recharge_requests in Firestore
        db.collection('recharge_requests').onSnapshot(snap => {
          const liveReqs = [];
          snap.forEach(doc => {
            const data = doc.data();
            if (data) liveReqs.push(data);
          });
          if (liveReqs.length > 0) {
            localStorage.setItem('sw_recharge_requests', JSON.stringify(liveReqs));
            renderSubscribers();
          }
        }, err => console.warn("Firestore recharge_requests listen:", err));

        // 2. Also listen to Realtime Database recharge_requests
        if (rtdb) {
          rtdb.ref('recharge_requests').on('value', snap => {
            const val = snap.val();
            if (val) {
              const reqArray = Object.values(val);
              localStorage.setItem('sw_recharge_requests', JSON.stringify(reqArray));
              renderSubscribers();
            }
          });
        }

        // 3. Listen to live subscribers in Firestore
        db.collection('subscribers').onSnapshot(snap => {
          const liveData = [];
          snap.forEach(doc => liveData.push(doc.data()));
          if (liveData.length > 0) {
            localStorage.setItem('sw_active_subscribers', JSON.stringify(liveData));
            renderSubscribers();
          }
        }, err => console.warn("Firestore subscribers listen:", err));

      } catch (err) {
        console.warn("initFirebaseLiveListener error:", err);
      }
    }

    window.addEventListener('storage', () => {
      renderSubscribers();
    });
    initFirebaseLiveListener();
    });
  </script>
